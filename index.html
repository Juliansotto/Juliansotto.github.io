<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catequesis">
<meta name="description" content="Control de asistencia, ausencias y retiros de catequesis. Funciona sin internet.">
<title>Catequesis · Asistencia y retiros</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝️</text></svg>">
<style>
:root{
  --azul:#1e3a5f; --azul2:#2c5282; --azul3:#e8eef7;
  --verde:#1f7a45; --verde-claro:#e3f6ea;
  --rojo:#b3261e; --rojo-claro:#fdeaea;
  --ambar:#8a5a00; --ambar-claro:#fdf3dd;
  --violeta:#5b3ea8; --violeta-claro:#eee9fb;
  --gris:#eef1f6; --gris2:#f7f9fc; --linea:#d5dce6; --txt:#17202a; --txt2:#5a6b80;
  --radio:14px; --sombra:0 1px 2px rgba(16,32,64,.08), 0 6px 18px rgba(16,32,64,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--gris); color:var(--txt); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; padding-bottom:60px;
}
h1,h2,h3{margin:0 0 .4rem; line-height:1.2}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:.3rem 0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- cabecera ---------- */
.fijo{position:sticky; top:0; z-index:30}
.cabecera{
  background:linear-gradient(135deg,var(--azul),var(--azul2)); color:#fff;
  padding:10px 14px; display:flex; gap:10px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; box-shadow:0 2px 10px rgba(0,0,0,.18)
}
.marca strong{display:block; font-size:1rem; letter-spacing:.2px}
.marca span{display:block; font-size:.72rem; opacity:.85}
.modo{display:flex; gap:8px; align-items:center}
.chip{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:999px; padding:5px 11px; font-size:.74rem; white-space:nowrap
}
.chip.ok{background:rgba(76,222,128,.22); border-color:rgba(150,255,190,.5)}
.btn-mini{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:10px; padding:6px 10px; font-size:.78rem
}
.btn-mini:hover{background:rgba(255,255,255,.26)}

/* ---------- pestañas ---------- */
.pestanas{
  display:flex; gap:6px; overflow-x:auto; padding:8px 10px; background:#fff;
  border-bottom:1px solid var(--linea); z-index:25;
  scrollbar-width:none
}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{
  border:1px solid var(--linea); background:var(--gris2); color:var(--txt2);
  padding:8px 13px; border-radius:999px; white-space:nowrap; font-size:.86rem; font-weight:600
}
.pestanas button.act{background:var(--azul); color:#fff; border-color:var(--azul)}

/* ---------- estructura ---------- */
main{padding:12px; max-width:1180px; margin:0 auto}
.panel{background:#fff; border:1px solid var(--linea); border-radius:var(--radio); padding:14px; box-shadow:var(--sombra); margin-bottom:14px}
.barra,.barra2{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:10px}
.barra2{align-items:center}
.campo{display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--txt2); font-weight:600; flex:1 1 190px; min-width:150px}
.campo select,.campo input,.buscar,input[type=text],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{
  padding:9px 10px; border:1px solid var(--linea); border-radius:10px; background:#fff; width:100%
}
.campo input:focus,.campo select:focus,.buscar:focus,textarea:focus{outline:2px solid var(--azul2); outline-offset:0}
.buscar{flex:1 1 220px; min-width:170px}
.resumen{font-size:.8rem; color:var(--txt2); font-weight:600}
.btn{
  background:var(--azul2); color:#fff; border:1px solid var(--azul2); border-radius:10px;
  padding:10px 14px; font-weight:600; font-size:.88rem
}
.btn.ok{background:var(--verde); border-color:var(--verde)}
.btn.gris{background:#fff; color:var(--txt2); border-color:var(--linea)}
.btn.rojo{background:var(--rojo); border-color:var(--rojo)}
.btn.chico{padding:6px 10px; font-size:.8rem}
.btn:hover{filter:brightness(1.07)}
.ayuda{color:var(--txt2); font-size:.84rem}
.vacio{color:var(--txt2); font-size:.9rem; padding:14px; text-align:center; background:var(--gris2); border-radius:10px; border:1px dashed var(--linea)}

/* ---------- tarjetas de alumno ---------- */
.listaAlumnos{display:grid; gap:10px}
.alumno{
  border:1px solid var(--linea); border-left:6px solid var(--linea); border-radius:12px;
  padding:10px 12px; background:#fff
}
.alumno.est-presente{border-left-color:var(--verde); background:linear-gradient(0deg,var(--verde-claro),#fff 55%)}
.alumno.est-ausente{border-left-color:var(--rojo); background:linear-gradient(0deg,var(--rojo-claro),#fff 55%)}
.alumno.est-tarde{border-left-color:var(--ambar); background:linear-gradient(0deg,var(--ambar-claro),#fff 55%)}
.alumno.est-justificado{border-left-color:var(--violeta); background:linear-gradient(0deg,var(--violeta-claro),#fff 55%)}
.fila-sup{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.quien{display:flex; gap:9px; align-items:flex-start; min-width:0}
.num{
  background:var(--azul3); color:var(--azul); font-weight:700; font-size:.78rem;
  border-radius:8px; padding:3px 8px; min-width:28px; text-align:center; flex:0 0 auto
}
.nombre{font-weight:700; font-size:.98rem; overflow-wrap:anywhere}
.meta{font-size:.74rem; color:var(--txt2); margin-top:2px}
.etiqueta{
  font-size:.66rem; font-weight:700; border-radius:999px; padding:2px 7px; margin-left:6px;
  vertical-align:middle; white-space:nowrap
}
.etiqueta.revisar{background:var(--ambar-claro); color:var(--ambar); border:1px solid #e6cfa0}
.etiqueta.inactivo{background:var(--gris); color:var(--txt2); border:1px solid var(--linea)}
.estados{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.estados button{
  border:1px solid var(--linea); background:#fff; color:var(--txt2); border-radius:999px;
  padding:7px 12px; font-size:.82rem; font-weight:600
}
.estados button.on{color:#fff}
.estados button[data-estado=presente].on{background:var(--verde); border-color:var(--verde)}
.estados button[data-estado=ausente].on{background:var(--rojo); border-color:var(--rojo)}
.estados button[data-estado=tarde].on{background:var(--ambar); border-color:var(--ambar)}
.estados button[data-estado=justificado].on{background:var(--violeta); border-color:var(--violeta)}
.cajaRetiro{margin-top:10px; padding-top:8px; border-top:1px dashed var(--linea)}
.cajaRetiro summary{cursor:pointer; font-size:.82rem; font-weight:700; color:var(--azul2); padding:2px 0; user-select:none}
.cajaRetiro summary::marker{color:var(--azul2)}
.retiro{
  display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:8px
}
.retiro label{display:flex; flex-direction:column; gap:3px; font-size:.72rem; color:var(--txt2); font-weight:600; flex:1 1 150px}
.retiro label.chk{flex:0 0 auto; flex-direction:row; align-items:center; gap:6px; font-size:.8rem; color:var(--txt)}
.retiro input,.retiro select{padding:8px 9px; border:1px solid var(--linea); border-radius:9px; width:100%}
.retiro .ancho{flex:2 1 220px}
.chipSalida{font-size:.76rem; font-weight:700; border-radius:999px; padding:3px 9px; display:inline-block}
.chipSalida.en-clase{background:var(--verde-claro); color:var(--verde)}
.chipSalida.retirado{background:var(--azul3); color:var(--azul)}
.chipSalida.no-vino{background:var(--rojo-claro); color:var(--rojo)}
.chipSalida.sin{background:var(--gris); color:var(--txt2)}

/* ---------- tablas ---------- */
.tabla-scroll{overflow:auto; border:1px solid var(--linea); border-radius:12px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:.84rem; background:#fff}
th,td{border-bottom:1px solid var(--linea); border-right:1px solid var(--linea); padding:6px 8px; text-align:left; vertical-align:middle}
th{background:var(--azul3); color:var(--azul); font-size:.74rem; text-transform:uppercase; letter-spacing:.3px; position:sticky; top:0; z-index:2}
td.c,th.c{text-align:center}
tbody tr:hover{background:var(--gris2)}
.marca-p{color:var(--verde); font-weight:800}
.marca-a{color:var(--rojo); font-weight:800}
.marca-t{color:var(--ambar); font-weight:800}
.marca-j{color:var(--violeta); font-weight:800}
.tabla-scroll td.c{cursor:pointer}

/* ---------- consulta ---------- */
.consulta .tarjeta-consulta{
  border:2px solid var(--azul3); border-radius:16px; padding:16px; margin-top:12px; background:#fff
}
.estado-grande{
  font-size:1.25rem; font-weight:800; border-radius:12px; padding:12px 14px; margin:8px 0;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap
}
.estado-grande.en-clase{background:var(--verde-claro); color:var(--verde); border:1px solid #b7e3c7}
.estado-grande.retirado{background:var(--azul3); color:var(--azul); border:1px solid #bcd0e8}
.estado-grande.ausente{background:var(--rojo-claro); color:var(--rojo); border:1px solid #efc3c0}
.estado-grande.justificado{background:var(--violeta-claro); color:var(--violeta); border:1px solid #cfc2f0}
.estado-grande.sin{background:var(--gris); color:var(--txt2); border:1px solid var(--linea)}
.dato{display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--linea); font-size:.9rem; flex-wrap:wrap}
.dato b{min-width:150px; color:var(--txt2); font-weight:600}

/* ---------- modo padres (pantalla grande, sin escribir nada) ---------- */
.kiosco{position:fixed; inset:0; background:#f4f7fb; z-index:75; display:flex; flex-direction:column; overflow:hidden}
.kiosco *{min-width:0}
.kiosco-cab{
  background:linear-gradient(135deg,var(--azul),var(--azul2)); color:#fff;
  padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.2); flex:0 0 auto
}
.kiosco-titulo{min-width:0; overflow:hidden}
.kiosco-titulo strong{display:block; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kiosco-titulo span{display:block; font-size:.78rem; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kiosco-cerrar{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.45); color:#fff;
  font-size:1.2rem; border-radius:12px; width:46px; height:46px; flex:0 0 auto
}
.kiosco-cuerpo{flex:1; overflow:auto; padding:16px; width:100%; max-width:940px; margin:0 auto; -webkit-overflow-scrolling:touch}
.kiosco-preg{font-size:1.45rem; font-weight:800; text-align:center; margin:4px 0 14px}
.kiosco-buscar{
  width:100%; padding:16px 18px; font-size:1.15rem; border-radius:14px;
  border:2px solid var(--linea); margin-bottom:12px; background:#fff
}
.kiosco-buscar:focus{outline:none; border-color:var(--azul2)}
.kiosco-niveles{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px}
.kiosco-niveles button{
  border:1px solid var(--linea); background:#fff; border-radius:999px; padding:10px 18px;
  font-weight:700; font-size:.95rem; color:var(--txt2)
}
.kiosco-niveles button.act{background:var(--azul); color:#fff; border-color:var(--azul)}
.kiosco-lista{display:grid; gap:10px; grid-template-columns:minmax(0,1fr)}
@media (min-width:680px){.kiosco-lista{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.kiosco-nombre{
  display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:left;
  background:#fff; border:2px solid var(--linea); border-radius:14px; padding:16px 18px;
  font-size:1.08rem; font-weight:700; color:var(--txt); box-shadow:0 1px 2px rgba(16,32,64,.06);
  width:100%; overflow:hidden
}
.kiosco-nombre b{font-weight:700; overflow-wrap:anywhere; line-height:1.25}
.kiosco-nombre span{font-size:.78rem; color:var(--txt2); font-weight:700; white-space:nowrap; flex:0 0 auto}
.kiosco-nombre:hover,.kiosco-nombre:focus{border-color:var(--azul2)}
.kiosco-volver{
  background:#fff; border:1px solid var(--linea); border-radius:12px; padding:12px 18px;
  font-size:1rem; font-weight:700; color:var(--azul2); margin-bottom:14px
}
.kiosco-tarjeta{background:#fff; border-radius:18px; padding:20px; box-shadow:var(--sombra); border:2px solid var(--azul3)}
.kiosco-tarjeta h2{font-size:1.55rem; margin-bottom:4px}
.kiosco-tarjeta .estado-grande{font-size:1.45rem; margin:14px 0}
.kiosco-tarjeta .dato{font-size:1rem}
.kiosco-pie{text-align:center; color:var(--txt2); font-size:.85rem; margin:14px 0 4px}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; background:rgba(12,22,40,.55); display:flex; align-items:center; justify-content:center; padding:14px; z-index:60}
.modal.oculto{display:none}
.modal-caja{background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:90vh; overflow:auto; box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-cab{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--linea); position:sticky; top:0; background:#fff}
.modal-cuerpo{padding:14px 16px; display:grid; gap:11px}
.modal-pie{padding:12px 16px; border-top:1px solid var(--linea); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; position:sticky; bottom:0; background:#fff}
.cerrar{background:none; border:none; font-size:1.3rem; color:var(--txt2); line-height:1}
.campoM{display:flex; flex-direction:column; gap:4px; font-size:.8rem; font-weight:600; color:var(--txt2)}
.campoM input,.campoM select,.campoM textarea{padding:10px; border:1px solid var(--linea); border-radius:10px; font-weight:400}
.campoM.inline{flex-direction:row; align-items:center; gap:8px}
.campoM.inline input{width:auto}
.lista-enlaces{display:grid; gap:6px; max-height:52vh; overflow:auto}
.enlace{display:flex; gap:8px; align-items:center; border:1px solid var(--linea); border-radius:10px; padding:7px 9px; font-size:.8rem}
.enlace code{flex:1; overflow-wrap:anywhere; color:var(--azul2)}

/* ---------- avisos ---------- */
.avisos{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:80; display:grid; gap:8px; width:min(92vw,460px)}
.aviso{
  background:#17202a; color:#fff; border-radius:12px; padding:10px 14px; font-size:.86rem;
  box-shadow:0 10px 24px rgba(0,0,0,.28); animation:aparece .18s ease-out
}
.aviso.error{background:var(--rojo)}
.aviso.ok{background:var(--verde)}
@keyframes aparece{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ---------- pie ---------- */
.pie{text-align:center; color:var(--txt2); font-size:.74rem; padding:6px 12px 24px}
.oculto{display:none !important}
.grid2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.caja{border:1px solid var(--linea); border-radius:12px; padding:12px; background:var(--gris2)}
.caja h3{color:var(--azul)}
.lista-simple{list-style:none; padding:0; margin:6px 0}
.lista-simple li{display:flex; gap:8px; justify-content:space-between; align-items:center; border-bottom:1px dashed var(--linea); padding:7px 0; font-size:.88rem; flex-wrap:wrap}
.kv{font-size:.85rem; color:var(--txt2)}
code{background:var(--gris); padding:2px 6px; border-radius:6px; font-size:.85em}

@media (min-width:760px){
  body{font-size:17px}
  .nombre{font-size:1.02rem}
}
@media print{
  .cabecera,.pestanas,.barra,.barra2,.retiro .editar,.noImprimir,.avisos,.pie,.kiosco{display:none !important}
  .fijo{position:static}
  .cajaRetiro{border-top:none}
  body{background:#fff; padding:0}
  .panel{border:none; box-shadow:none; padding:0; margin:0}
  .tabla-scroll{border:none; overflow:visible}
  th{position:static}
  table{font-size:11px}
  th,td{border:1px solid #999; padding:3px 4px}
  .tabla-scroll td.c{cursor:default}
  @page{size:A4 landscape; margin:10mm}
}
</style>
</head>

  </div>

    <button id="btnModo" class="btn-mini" data-accion="abrirModo">Modo catequista</button>
    <button id="btnBloquear" class="btn-mini oculto" data-accion="bloquear">🔒 Bloquear</button>
  </div>
</header>

<nav class="pestanas" id="pestanas"></nav>

<main id="vista"></main>

</datalist>
<datalist id="listaAcompanantes"></datalist>

<div id="modal" class="modal oculto" aria-hidden="true"></div>

<div id="kiosco" class="kiosco oculto" aria-hidden="true">
  <div class="kiosco-cab">
    <div class="kiosco-titulo">
      <strong>Consulta de padres</strong>

</div>

<script>
/* =========================================================================
   Generador de planillas .xlsx  (sin librerías, funciona sin internet)
   Reproduce el formato de "Planilla_2026.xlsx" de la parroquia:
     título, NIVEL / CATEQUISTA / AÑO / SECTOR / FRATERNIDAD,
     columnas N° | NOMBRES | APELLIDOS | meses con sus días | OBSERVACIONES,
     marcas P (presente) A (ausente) T (tarde) J (justificado)
     y las firmas de Catequista / Coordinador de Catequesis.
   API:  CatequesisXLSX.construir(datos) -> Uint8Array
   ========================================================================= */
var CatequesisXLSX = (function () {
  'use strict';

  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
    'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /* ------------------------------ helpers ------------------------------ */
  var codificador = new TextEncoder();

  function bytes(txt) { return codificador.encode(txt); }

  function escXml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }

  function letraCol(n) {
    var s = '';
    while (n > 0) {
      var r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  var TABLA_CRC = (function () {
    var t = new Int32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c;
    }
    return t;
  })();

  function crc32(u8) {
    var c = -1;
    for (var i = 0; i < u8.length; i++) c = (c >>> 8) ^ TABLA_CRC[(c ^ u8[i]) & 0xFF];
    return (c ^ -1) >>> 0;
  }

  /* --------------------------- ZIP sin comprimir ------------------------ */
  function zip(archivos) {
    var partes = [], central = [], desplazamiento = 0;
    archivos.forEach(function (a) {
      var nombre = bytes(a.nombre);
      var datos = a.datos;
      var crc = crc32(datos);
      var cab = new Uint8Array(30 + nombre.length);
      var dv = new DataView(cab.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true);
      dv.setUint16(12, 0x0021, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, datos.length, true);
      dv.setUint32(22, datos.length, true);
      dv.setUint16(26, nombre.length, true);
      dv.setUint16(28, 0, true);
      cab.set(nombre, 30);
      partes.push(cab, datos);

      var cen = new Uint8Array(46 + nombre.length);
      var dc = new DataView(cen.buffer);
      dc.setUint32(0, 0x02014b50, true);
      dc.setUint16(4, 20, true);
      dc.setUint16(6, 20, true);
      dc.setUint16(8, 0x0800, true);
      dc.setUint16(10, 0, true);
      dc.setUint16(12, 0, true);
      dc.setUint16(14, 0x0021, true);
      dc.setUint32(16, crc, true);
      dc.setUint32(20, datos.length, true);
      dc.setUint32(24, datos.length, true);
      dc.setUint16(28, nombre.length, true);
      dc.setUint16(30, 0, true);
      dc.setUint16(32, 0, true);
      dc.setUint16(34, 0, true);
      dc.setUint16(36, 0, true);
      dc.setUint32(38, 0, true);
      dc.setUint32(42, desplazamiento, true);
      cen.set(nombre, 46);
      central.push(cen);

      desplazamiento += cab.length + datos.length;
    });

    var tamCentral = central.reduce(function (s, c) { return s + c.length; }, 0);
    var fin = new Uint8Array(22);
    var df = new DataView(fin.buffer);
    df.setUint32(0, 0x06054b50, true);
    df.setUint16(4, 0, true);
    df.setUint16(6, 0, true);
    df.setUint16(8, archivos.length, true);
    df.setUint16(10, archivos.length, true);
    df.setUint32(12, tamCentral, true);
    df.setUint32(16, desplazamiento, true);
    df.setUint16(20, 0, true);

    var todo = partes.concat(central, [fin]);
    var total = todo.reduce(function (s, p) { return s + p.length; }, 0);
    var salida = new Uint8Array(total), pos = 0;
    todo.forEach(function (p) { salida.set(p, pos); pos += p.length; });
    return salida;
  }

  /* ------------------------------- estilos ------------------------------ */
  var ESTILOS = {
    normal: 0, titulo: 1, etiqueta: 2, etiquetaDer: 3, cabecera: 4,
    numero: 5, textoIzq: 6, obs: 7, marca: 8, leyenda: 9, firmaLinea: 10, firmaTexto: 11
  };

  function estilosXml() {
    var fuentes = [
      '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>',                 // 0
      '<font><sz val="24"/><name val="Times New Roman"/><b/><family val="1"/></font>',    // 1 título
      '<font><sz val="14"/><name val="Calibri"/><b/><family val="2"/></font>',            // 2 etiquetas
      '<font><sz val="12"/><name val="Calibri"/><b/><family val="2"/></font>',            // 3 cabecera
      '<font><sz val="12"/><name val="Calibri"/><family val="2"/></font>',                // 4 texto
      '<font><sz val="10"/><name val="Calibri"/><family val="2"/></font>',                // 5 observaciones
      '<font><sz val="9"/><name val="Calibri"/><i/><color rgb="FF808080"/><family val="2"/></font>', // 6 leyenda
      '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>'                 // 7 firma
    ];
    var rellenos = [
      '<fill><patternFill patternType="none"/></fill>',
      '<fill><patternFill patternType="gray125"/></fill>'
    ];
    function borde(izq, der, arr, aba) {
      function lado(nombre, activo) {
        return activo
          ? '<' + nombre + ' style="thin"><color rgb="FF000000"/></' + nombre + '>'
          : '<' + nombre + '/>';
      }
      return '<border>' + lado('left', izq) + lado('right', der) + lado('top', arr) + lado('bottom', aba) + '<diagonal/></border>';
    }
    var bordes = [
      '<border><left/><right/><top/><bottom/><diagonal/></border>',   // 0 sin borde
      borde(1, 1, 1, 1),                                             // 1 caja fina
      '<border><left/><right/><top/><bottom style="medium"><color rgb="FF000000"/></bottom><diagonal/></border>' // 2 línea de firma
    ];
    function xf(fuente, relleno, bordeIdx, alin) {
      return '<xf numFmtId="0" fontId="' + fuente + '" fillId="' + (relleno || 0) + '" borderId="' + (bordeIdx || 0) + '" xfId="0"' +
        (bordeIdx ? ' applyBorder="1"' : '') +
        ' applyFont="1"' + (alin ? ' applyAlignment="1"' : '') + '>' +
        (alin ? '<alignment ' + alin + '/>' : '') + '</xf>';
    }
    var centrada = 'horizontal="center" vertical="center"';
    var celdas = [
      xf(0),                                                       // 0 normal
      xf(1, 0, 0, 'horizontal="center" vertical="center" wrapText="1"'),  // 1 título
      xf(2, 0, 0, 'horizontal="left" vertical="center"'),            // 2 etiqueta
      xf(2, 0, 0, 'horizontal="right" vertical="center"'),           // 3 etiqueta derecha
      xf(3, 0, 1, 'horizontal="center" vertical="center" wrapText="1"'), // 4 cabecera
      xf(4, 0, 1, centrada),                                        // 5 número
      xf(4, 0, 1, 'horizontal="left" vertical="center"'),            // 6 texto izquierda
      xf(5, 0, 1, 'horizontal="left" vertical="center" wrapText="1"'), // 7 observaciones
      xf(3, 0, 1, centrada),                                        // 8 marca
      xf(6, 0, 0, 'horizontal="center"'),                            // 9 leyenda
      xf(0, 0, 2, ''),                                              // 10 línea de firma
      xf(7, 0, 0, centrada)                                         // 11 texto de firma
    ];
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="' + fuentes.length + '">' + fuentes.join('') + '</fonts>' +
      '<fills count="' + rellenos.length + '">' + rellenos.join('') + '</fills>' +
      '<borders count="' + bordes.length + '">' + bordes.join('') + '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="' + celdas.length + '">' + celdas.join('') + '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  /* ----------------------------- nombre partido ------------------------- */
  var PARTICULAS = { de: 1, del: 1, la: 1, las: 1, los: 1, y: 1, san: 1, santa: 1, van: 1, da: 1, das: 1, do: 1, dos: 1, di: 1, 'de la': 1 };

  /* Separa "Santiago De Jesus Salinas Ortiz" en NOMBRES = "Santiago De Jesus"
     y APELLIDOS = "Salinas Ortiz" (los nombres de pila primero, como en la
     planilla de papel). Si el nombre es corto, reparte simple. */
  function dividirNombre(completo) {
    var t = String(completo || '').replace(/\s+/g, ' ').trim();
    if (!t) return { nombres: '', apellidos: '' };
    var p = t.split(' ');
    if (p.length === 1) return { nombres: p[0], apellidos: '' };
    if (p.length === 2) return { nombres: p[0], apellidos: p[1] };
    var corte = 0, sustantivos = 0;
    for (var i = 0; i < p.length && sustantivos < 2; i++) {
      var esParticula = !!PARTICULAS[p[i].toLowerCase()];
      if (!esParticula) sustantivos++;
      corte = i + 1;
    }
    if (corte >= p.length) corte = p.length - 1;
    if (corte < 1) corte = 1;
    return { nombres: p.slice(0, corte).join(' '), apellidos: p.slice(corte).join(' ') };
  }

  /* ------------------------------- libro -------------------------------- */
  function construir(datos) {
    var fechas = (datos.fechas || []).slice().sort();
    var filas = datos.filas || [];
    var nombreMes = function (f) {
      var m = parseInt(String(f).slice(5, 7), 10);
      return (MESES[m - 1] || '').toUpperCase();
    };
    /* grupos de columnas por mes (para el encabezado "SEPTIEMBRE", "OCTUBRE"…) */
    var grupos = [];
    fechas.forEach(function (f, i) {
      var mes = String(f).slice(0, 7);
      var ultimo = grupos[grupos.length - 1];
      if (ultimo && ultimo.mes === mes) ultimo.cols.push(5 + i);
      else grupos.push({ mes: mes, cols: [5 + i] });
    });

    var colObs = 5 + fechas.length;             // OBSERVACIONES
    var ultimaCol = colObs;
    var mitad = 4 + Math.max(1, Math.ceil(fechas.length / 2));

    var filasXml = [];
    var merges = [];
    var F = { r: 0 };

    function celda(fila, col, valor, estilo, tipo) {
      var ref = letraCol(col) + fila;
      if (valor === '' || valor == null) {
        return '<c r="' + ref + '" s="' + estilo + '"/>';
      }
      if (tipo === 'num') return '<c r="' + ref + '" s="' + estilo + '"><v>' + valor + '</v></c>';
      return '<c r="' + ref + '" s="' + estilo + '" t="inlineStr"><is><t xml:space="preserve">' + escXml(valor) + '</t></is></c>';
    }

    function filaXml(fila, alto, celdas) {
      return '<row r="' + fila + '"' + (alto ? ' ht="' + alto + '" customHeight="1"' : '') + '>' + celdas + '</row>';
    }

    /* ---- fila 1: aire ---- */
    filasXml.push(filaXml(1, 8, ''));

    /* ---- fila 2: título ---- */
    filasXml.push(filaXml(2, 40,
      '<c r="B2" s="' + ESTILOS.titulo + '" t="inlineStr"><is><t>' + escXml(datos.titulo || 'PLANILLA DE ASISTENCIA') + '</t></is></c>' +
      celda(2, 3, '', ESTILOS.titulo) + celda(2, ultimaCol, '', ESTILOS.titulo)));
    merges.push('B2:' + letraCol(ultimaCol) + '2');

    /* ---- fila 3: nivel / año - sector ---- */
    var f3 = '<c r="B3" s="' + ESTILOS.etiqueta + '"/>' +
      '<c r="C3" s="' + ESTILOS.etiqueta + '" t="inlineStr"><is><t xml:space="preserve">NIVEL DE CATEQUESIS: ' + escXml(datos.nivel) + '</t></is></c>';
    if (mitad > 3) merges.push('C3:' + letraCol(mitad) + '3');
    var cAnio = letraCol(mitad + 1) + '3';
    f3 += '<c r="' + cAnio + '" s="' + ESTILOS.etiquetaDer + '" t="inlineStr"><is><t xml:space="preserve">AÑO: ' +
      escXml(datos.anio) + '     SECTOR: ' + escXml(datos.sector) + '</t></is></c>';
    if (ultimaCol > mitad + 1) merges.push(letraCol(mitad + 1) + '3:' + letraCol(ultimaCol) + '3');
    filasXml.push(filaXml(3, 22, f3));

    /* ---- fila 4: catequista / fraternidad ---- */
    var f4 = '<c r="B4" s="' + ESTILOS.etiqueta + '"/>' +
      '<c r="C4" s="' + ESTILOS.etiqueta + '" t="inlineStr"><is><t xml:space="preserve">CATEQUISTA: ' + escXml(datos.catequistas) + '</t></is></c>';
    if (mitad > 3) merges.push('C4:' + letraCol(mitad) + '4');
    f4 += '<c r="' + letraCol(mitad + 1) + '4" s="' + ESTILOS.etiquetaDer + '" t="inlineStr"><is><t xml:space="preserve">FRATERNIDAD: ' +
      escXml(datos.fraternidad) + '</t></is></c>';
    if (ultimaCol > mitad + 1) merges.push(letraCol(mitad + 1) + '4:' + letraCol(ultimaCol) + '4');
    filasXml.push(filaXml(4, 22, f4));

    /* ---- fila 5: aire ---- */
    filasXml.push(filaXml(5, 8, ''));

    /* ---- filas 6 y 7: encabezados ---- */
    var f6 = '<c r="B6" s="' + ESTILOS.cabecera + '" t="inlineStr"><is><t>N°</t></is></c>' +
      '<c r="C6" s="' + ESTILOS.cabecera + '" t="inlineStr"><is><t>NOMBRES</t></is></c>' +
      '<c r="D6" s="' + ESTILOS.cabecera + '" t="inlineStr"><is><t>APELLIDOS</t></is></c>';
    var f7 = celda(7, 2, '', ESTILOS.cabecera) + celda(7, 3, '', ESTILOS.cabecera) + celda(7, 4, '', ESTILOS.cabecera);
    merges.push('B6:B7'); merges.push('C6:C7'); merges.push('D6:D7');
    grupos.forEach(function (g) {
      var c1 = g.cols[0], c2 = g.cols[g.cols.length - 1];
      f6 += '<c r="' + letraCol(c1) + '6" s="' + ESTILOS.cabecera + '" t="inlineStr"><is><t>' + escXml(nombreMes(g.mes + '-01')) + '</t></is></c>';
      for (var c = c1; c <= c2; c++) f7 += celda(7, c, '', ESTILOS.cabecera);
      if (c2 > c1) merges.push(letraCol(c1) + '6:' + letraCol(c2) + '6');
    });
    fechas.forEach(function (f, i) {
      var dia = String(f).slice(8, 10).replace(/^0/, '');
      f7 += celda(7, 5 + i, dia, ESTILOS.cabecera, 'num');
    });
    f6 += '<c r="' + letraCol(colObs) + '6" s="' + ESTILOS.cabecera + '" t="inlineStr"><is><t>OBSERVACIONES</t></is></c>';
    merges.push(letraCol(colObs) + '6:' + letraCol(colObs) + '7');
    filasXml.push(filaXml(6, 26, f6));
    filasXml.push(filaXml(7, 20, f7));

    /* ---- alumnos ---- */
    var filaIni = 8;
    filas.forEach(function (al, i) {
      var r = filaIni + i;
      var partes = al.nombres != null ? { nombres: al.nombres, apellidos: al.apellidos || '' } : dividirNombre(al.nombre);
      var celdas = celda(r, 2, i + 1, ESTILOS.numero, 'num') +
        celda(r, 3, partes.nombres, ESTILOS.textoIzq) +
        celda(r, 4, partes.apellidos, ESTILOS.textoIzq);
      fechas.forEach(function (f, j) {
        var m = (al.marcas || {})[f] || '';
        celdas += celda(r, 5 + j, m, m ? ESTILOS.marca : ESTILOS.numero);
      });
      celdas += celda(r, colObs, al.obs || '', ESTILOS.obs);
      filasXml.push(filaXml(r, 20, celdas));
    });

    var filaFin = filaIni + filas.length - 1;
    var filaTotales = filaFin + 1;

    /* ---- fila de totales por día ---- */
    var fTot = celda(filaTotales, 2, '', ESTILOS.cabecera) +
      '<c r="C' + filaTotales + '" s="' + ESTILOS.cabecera + '" t="inlineStr"><is><t>TOTAL PRESENTES</t></is></c>' +
      celda(filaTotales, 4, '', ESTILOS.cabecera);
    merges.push('C' + filaTotales + ':D' + filaTotales);
    fechas.forEach(function (f, j) {
      var n = 0;
      filas.forEach(function (al) {
        var m = (al.marcas || {})[f];
        if (m === 'P' || m === 'T') n++;
      });

<script>
/* =========================================================================
   Catequesis · Asistencia y retiros  —  lógica de la aplicación
   Funciona sin internet: los datos se guardan en el navegador (localStorage).
   Si se abre con el servidor local (servidor.js), los datos se comparten
   entre la PC del catequista y los celulares de la misma red.
   ========================================================================= */
(function () {
'use strict';

/* ------------------------------ utilidades ------------------------------ */
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var ESTADOS = {
  presente:    { t:'Presente',    s:'✓', c:'marca-p' },
  ausente:     { t:'Ausente',     s:'✗', c:'marca-a' },
  tarde:       { t:'Tarde',       s:'T', c:'marca-t' },
  justificado: { t:'Justificado', s:'J', c:'marca-j' }
};
var PARENTESCOS = ['Mamá','Papá','Abuela','Abuelo','Tía','Tío','Hermana/o mayor','Tutor/a legal','Otro familiar','Se retiró solo/a'];

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

}

}
function nuevoId(p) { return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function isoDe(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function hoyISO() { return isoDe(new Date()); }
function mesDe(iso) { return String(iso || '').slice(0, 7); }
function fechaLarga(iso) {
  if (!iso || iso.length < 10) return '—';
  var p = iso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  return DIAS[d.getDay()].charAt(0).toUpperCase() + DIAS[d.getDay()].slice(1) + ' ' + p[2] + ' de ' + MESES[p[1] - 1] + ' de ' + p[0];
}
function fechaCorta(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
function mesLargo(ym) { var p = String(ym).split('-').map(Number); return MESES[p[1] - 1] + ' ' + p[0]; }
function horaAhora() { var d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function sabadosDelMes(ym) {
  var p = ym.split('-').map(Number), out = [], d = new Date(p[0], p[1] - 1, 1);
  while (d.getMonth() === p[1] - 1) { if (d.getDay() === 6) out.push(isoDe(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function descargar(nombre, texto, tipo) {
  var b = new Blob([texto], { type: tipo || 'text/plain;charset=utf-8' });
  var u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
}
function descargarBytes(nombre, bytes, tipo) {
  var b = new Blob([bytes], { type: tipo || 'application/octet-stream' });
  var u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 2000);
}
function aviso(msg, tipo) {
  var c = $('#avisos'); if (!c) return;
  var div = document.createElement('div');
  div.className = 'aviso ' + (tipo || '');
  div.textContent = msg;
  c.appendChild(div);
  setTimeout(function () { div.style.opacity = '0'; div.style.transition = 'opacity .3s'; }, 2100);
  setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 2600);
}

/* -------------------------------- estado -------------------------------- */
var CLAVE = 'catequesis.v1';
var CLAVE_SESION = 'catequesis.modo';
var D = cargar();
var vista = 'asistencia';
var nivelId = (D.niveles[0] || {}).id || null;
var fecha = fechaSugerida(nivel(nivelId));
var mesRep = mesDe(fecha) || mesDe(hoyISO());
var filtroAlumnos = '';
var consultaQ = '';
var admin = false;
var tGuardar = null, ultimaEdicion = 0, modalOk = null;

try { admin = sessionStorage.getItem(CLAVE_SESION) === '1' || !D.pin; } catch (e) {}

/* ¿Este navegador deja guardar? (algunos celulares bloquean el guardado cuando
   el archivo se abre directamente desde "Descargas"). */
var almacenOk = (function () {
  try {
    localStorage.setItem('__prueba_catequesis', '1');
    localStorage.removeItem('__prueba_catequesis');
    return true;
  } catch (e) { return false; }
})();

/* ------------------------------ persistencia ---------------------------- */
function cargar() {
  try {
    var raw = localStorage.getItem(CLAVE);
    if (raw) { var d = JSON.parse(raw); if (d && d.alumnos) return normalizar(d); }
  } catch (e) { /* datos dañados: se regeneran */ }
  return normalizar(JSON.parse(JSON.stringify(DATOS_INICIALES)));
}
function normalizar(d) {
  d.version = d.version || 1;
  d.rev = d.rev || 1;
  d.anio = d.anio || 2026;
  if (typeof d.pin !== 'string') d.pin = '1234';
  if (typeof d.buscarPorNombre !== 'boolean') d.buscarPorNombre = true;
  d.fraternidad = d.fraternidad || { nombre: 'San Antonio de Padua', sector: '1 (uno)' };
  d.niveles = d.niveles || [];
  d.alumnos = d.alumnos || [];
  d.registros = d.registros || {};
  d.catequistaActual = d.catequistaActual || '';
  d.niveles.forEach(function (n) {
    n.fechas = (n.fechas || []).slice().sort();
    n.catequistas = n.catequistas || '';
  });
  var max = 1000;
  d.alumnos.forEach(function (a) {
    a.id = a.id || nuevoId('a');
    if (!a.codigo) { max++; a.codigo = String(max); }
    if (a.activo === undefined) a.activo = true;
    if (a.revisar === undefined) a.revisar = false;
    max = Math.max(max, parseInt(a.codigo, 10) || 1000);
  });
  return d;
}
function guardar(msg, inmediato) {
  ultimaEdicion = Date.now();
  D.rev = (D.rev || 0) + 1;
  try { localStorage.setItem(CLAVE, JSON.stringify(D)); } catch (e) { aviso('No se pudo guardar en este navegador', 'error'); }
  if (tGuardar) clearTimeout(tGuardar);
  if (inmediato) { Nube.enviar().then(function () { if (msg) aviso(msg, 'ok'); }); }
  else {
    tGuardar = setTimeout(function () {
      Nube.enviar().then(function () { if (msg) aviso(msg, 'ok'); });
    }, 900);
  }
}

/* --------------------------- servidor (opcional) ------------------------ */
var Nube = {
  on: false,
  iniciar: function () {
    var self = this;
    if (location.protocol === 'file:') return Promise.resolve(false);
    return fetch('api/datos', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('sin api');
      return r.json();
    }).then(function (j) {
      self.on = true;
      if (j && j.datos && (j.datos.rev || 0) >= (D.rev || 0)) { D = normalizar(j.datos); }
      return true;
    }).catch(function () { self.on = false; return false; });
  },
  enviar: function () {
    if (!this.on) return Promise.resolve();
    var copia = D;
    return fetch('api/datos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rev: copia.rev || 1, datos: copia })
    }).catch(function () { Nube.on = false; aviso('Se perdió el contacto con el servidor local', 'error'); });
  },
  traer: function () {
    if (!this.on) return Promise.resolve();
    return fetch('api/datos', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.datos && (j.datos.rev || 0) > (D.rev || 0)) {
        D = normalizar(j.datos); render(); aviso('Datos actualizados desde otro dispositivo', 'ok');
      }
    }).catch(function () {});
  }
};

/* --------------------------- datos y consultas -------------------------- */
function nivel(id) { for (var i = 0; i < D.niveles.length; i++) if (D.niveles[i].id === id) return D.niveles[i]; return null; }
function alumnosDe(nid, incluirInactivos) {
  return D.alumnos.filter(function (a) { return a.nivelId === nid && (incluirInactivos || a.activo !== false); });
}
function alumno(id) { for (var i = 0; i < D.alumnos.length; i++) if (D.alumnos[i].id === id) return D.alumnos[i]; return null; }
function fechasDe(n) { return n ? (n.fechas || []).slice().sort() : []; }
function claveReg(aid, f) { return aid + '|' + f; }
function regDe(aid, f) { return D.registros[claveReg(aid, f)] || null; }
function obtenerReg(aid, f, crear) {
  var k = claveReg(aid, f);
  if (!D.registros[k] && crear) {
    D.registros[k] = { alumnoId: aid, fecha: f, estado: '', retirado: false, con: '', parentesco: '', horaSalida: '', nota: '', actualizado: '', por: '' };
  }
  return D.registros[k] || null;
}
function borrarReg(aid, f) { delete D.registros[claveReg(aid, f)]; }
function setEstado(aid, f, estado) {
  var r = obtenerReg(aid, f, true);
  var mismo = r.estado === estado;
  r.estado = mismo ? '' : estado;
  if (r.estado === '' && !r.retirado && !r.con && !r.horaSalida && !r.nota) { borrarReg(aid, f); }
  else { r.actualizado = new Date().toISOString(); r.por = D.catequistaActual || ''; }
  guardar('Asistencia guardada');
}
function setCampo(aid, f, campo, valor) {
  var r = obtenerReg(aid, f, true);
  r[campo] = valor;
  if (campo === 'retirado' && valor) {
    if (!r.horaSalida) r.horaSalida = horaAhora();
    if (!r.con && !r.parentesco) r.parentesco = '';
  }
  if (!r.estado && !r.retirado && !r.con && !r.horaSalida && !r.nota) { borrarReg(aid, f); return; }
  r.actualizado = new Date().toISOString();
  r.por = D.catequistaActual || '';
  guardar();
}
function resumenDia(nid, f) {
  var out = { p: 0, a: 0, t: 0, j: 0, ret: 0, sin: 0 };
  alumnosDe(nid).forEach(function (a) {
    var r = regDe(a.id, f);
    if (r && r.estado === 'presente') out.p++;
    else if (r && r.estado === 'ausente') out.a++;
    else if (r && r.estado === 'tarde') out.t++;
    else if (r && r.estado === 'justificado') out.j++;
    else out.sin++;
    if (r && r.retirado) out.ret++;

  return out;
}
function diasEntre(a, b) {
  var pa = String(a).split('-').map(Number), pb = String(b).split('-').map(Number);
  var da = new Date(pa[0], pa[1] - 1, pa[2]), db = new Date(pb[0], pb[1] - 1, pb[2]);
  return Math.round((da - db) / 86400000);
}
/* La fecha que más le sirve al catequista: hoy si hay clase, si no la clase más cercana
   (las fechas futuras ganan en caso de empate). */
function fechaSugerida(n) {
  var f = fechasDe(n), h = hoyISO();
  if (!f.length) return h;
  if (f.indexOf(h) >= 0) return h;
  var mejor = f[0], mejorD = Infinity;
  f.forEach(function (x) {
    var d = Math.abs(diasEntre(x, h));
    if (d < mejorD || (d === mejorD && x > h && mejor < h)) { mejor = x; mejorD = d; }
  });
  return mejor;
}
function ultimoConDatos(aid) {
  var fechas = Object.keys(D.registros).filter(function (k) { return k.indexOf(aid + '|') === 0; })
    .map(function (k) { return D.registros[k].fecha; }).sort();
  return fechas.length ? fechas[fechas.length - 1] : null;
}
function fechaConsulta(aid) {
  var h = hoyISO();
  if (regDe(aid, h)) return h;
  return ultimoConDatos(aid) || h;
}
function situacion(aid, f) {
  var r = regDe(aid, f);
  if (!r || (!r.estado && !r.retirado && !r.con)) {
    return { clase: 'sin', titulo: 'Sin registro todavía', detalle: 'El catequista todavía no cargó la asistencia de este día.' };
  }
  if (r.retirado) {
    var con = r.con ? ' con ' + r.con : (r.parentesco ? ' con ' + r.parentesco : '');
    var hora = r.horaSalida ? ' a las ' + r.horaSalida : '';
    return {
      clase: 'retirado',
      titulo: 'Ya se retiró' + con,
      detalle: 'Retiro registrado' + hora + (r.por ? ' · registrado por ' + r.por : '') + '.'
    };
  }
  if (r.estado === 'presente' || r.estado === 'tarde') {
    return { clase: 'en-clase', titulo: 'Está en clase', detalle: 'Asistió (' + ESTADOS[r.estado].t.toLowerCase() + '). Todavía no se registró su retiro.' };
  }
  if (r.estado === 'ausente') return { clase: 'ausente', titulo: 'Hoy no asistió', detalle: 'El catequista lo marcó ausente.' + (r.nota ? ' Observación: ' + r.nota : '') };
  if (r.estado === 'justificado') return { clase: 'justificado', titulo: 'Ausencia justificada', detalle: r.nota || 'El catequista marcó la ausencia como justificada.' };
  return { clase: 'sin', titulo: 'Sin registro todavía', detalle: '' };
}

/* -------------------------------- render -------------------------------- */
function render() {

    return '<button data-accion="tab" data-vista="' + p[0] + '" class="' + (vista === p[0] ? 'act' : '') + '">' + p[1] + '</button>';

}
function pintarCabecera() {

function pintarPie() {

function pintarDatalists() {

/* --------------------------- vista: asistencia -------------------------- */

      '<label class="campo"><span>Nivel de catequesis</span><select data-accion="cambiarNivel">' + opcionesNivel + '</select></label>' +

      '<span class="chipSalida sin">' + res.t + ' tarde</span> ' +

function listaTarjetas() {
  var lista = alumnosDe(nivelId).filter(function (a) {
    if (!filtroAlumnos) return true;
    var q = norm(filtroAlumnos);
    return norm(a.nombre).indexOf(q) >= 0 || String(a.codigo).indexOf(q) >= 0;
  });
  if (!lista.length) return '<p class="vacio">No hay alumnos que coincidan con la búsqueda.</p>';
  return lista.map(function (a, i) { return tarjetaAlumno(a, i + 1); }).join('');
}
function tarjetaAlumno(a, num) {
  var r = regDe(a.id, fecha) || {};
  var estado = r.estado || '';
  var clase = estado ? ' est-' + estado : '';
  var s = situacion(a.id, fecha);
  var botones = ['presente', 'ausente', 'tarde', 'justificado'].map(function (k) {
    return '<button data-accion="estado" data-id="' + a.id + '" data-estado="' + k + '" class="' + (estado === k ? 'on' : '') + '"' + (admin ? '' : ' disabled') + '>' +
      ESTADOS[k].s + ' ' + ESTADOS[k].t + '</button>';
  }).join('');
  var des = admin ? '' : ' disabled';
  return '' +
  '<article class="alumno' + clase + '" data-id="' + a.id + '">' +
    '<div class="fila-sup">' +
      '<div class="quien">' +
        '<span class="num">' + num + '</span>' +
        '<div>' +
          '<div class="nombre">' + esc(a.nombre) +
            (a.revisar ? '<span class="etiqueta revisar">⚠ revisar nombre</span>' : '') +
            (a.activo === false ? '<span class="etiqueta inactivo">inactivo</span>' : '') +
          '</div>' +
          '<div class="meta">Código #' + esc(a.codigo) + ' · ' + esc((nivel(a.nivelId) || {}).nombre || '') + (a.nota ? ' · ' + esc(a.nota) : '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
        '<span class="chipSalida ' + s.clase + '" data-chip="' + a.id + '">' + esc(s.titulo) + '</span>' +
        (admin ? '<div><button class="btn gris chico" data-accion="editarAlumno" data-id="' + a.id + '" style="margin-top:6px">✏️ Editar</button></div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="estados">' + botones + '</div>' +
    '<details class="cajaRetiro"' + ((estado === 'presente' || estado === 'tarde' || r.retirado || r.con) ? ' open' : '') + '>' +
      '<summary>🚪 Retiro · ¿con quién se fue?</summary>' +
      '<div class="retiro">' +
      '<label class="ancho">Se retiró con (familiar o pariente)' +
        '<input type="text" list="listaAcompanantes" data-accion="campoRetiro" data-campo="con" data-id="' + a.id + '" value="' + esc(r.con || '') + '" placeholder="Nombre y apellido"' + des + '>' +
      '</label>' +
      '<label>Parentesco' +
        '<input type="text" list="listaParentescos" data-accion="campoRetiro" data-campo="parentesco" data-id="' + a.id + '" value="' + esc(r.parentesco || '') + '" placeholder="Mamá, tía…"' + des + '>' +
      '</label>' +
      '<label style="flex:0 1 110px">Hora' +
        '<input type="time" data-accion="campoRetiro" data-campo="horaSalida" data-id="' + a.id + '" value="' + esc(r.horaSalida || '') + '"' + des + '>' +
      '</label>' +
      '<label class="chk"><input type="checkbox" data-accion="campoRetiro" data-campo="retirado" data-id="' + a.id + '"' + (r.retirado ? ' checked' : '') + des + '> Ya se retiró</label>' +
      '</div>' +
    '</details>' +
  '</article>';
}
function refrescarTarjeta(aid) {
  var el = $('.alumno[data-id="' + aid + '"]'); if (!el) return;
  var lista = alumnosDe(nivelId).filter(function (a) {
    if (!filtroAlumnos) return true;
    var q = norm(filtroAlumnos);
    return norm(a.nombre).indexOf(q) >= 0 || String(a.codigo).indexOf(q) >= 0;
  });
  var idx = 0;
  for (var i = 0; i < lista.length; i++) if (lista[i].id === aid) idx = i + 1;
  var tmp = document.createElement('div');
  tmp.innerHTML = tarjetaAlumno(alumno(aid), idx);
  el.parentNode.replaceChild(tmp.firstElementChild, el);
  var res = resumenDia(nivelId, fecha);
  var cont = $('#resumenChips');
  if (cont) {
    cont.innerHTML =
      '<span class="chipSalida en-clase">' + res.p + ' presentes</span> ' +
      '<span class="chipSalida no-vino">' + res.a + ' ausentes</span> ' +
      '<span class="chipSalida sin">' + res.t + ' tarde</span> ' +
      '<span class="chipSalida sin">' + res.j + ' justificados</span> ' +
      '<span class="chipSalida retirado">' + res.ret + ' retirados</span> ' +
      '<span class="chipSalida sin">' + res.sin + ' sin marcar</span>';
  }
}

/* ---------------------------- vista: consulta --------------------------- */
function vistaConsulta() {
  return '' +
  '<section class="panel consulta">' +
    '<h2>Consulta para padres y familiares</h2>' +
    '<p class="ayuda">La forma más fácil: tocá el botón verde y elegí el nombre de tu hijo/a de la lista. ' +
      'No hace falta escribir códigos ni tener internet.</p>' +
    '<button class="btn ok" data-accion="abrirKiosco" style="width:100%; font-size:1.05rem; padding:16px">👨‍👩‍👧 Abrir pantalla para padres</button>' +
    '<p class="ayuda" style="margin-top:16px">O si preferís, escribí el <b>código</b> (te lo dio el catequista) o el nombre:</p>' +
    '<div class="barra noImprimir">' +
      '<input class="buscar" id="qConsulta" data-accion="consultaQ" value="' + esc(consultaQ) + '" placeholder="Código (ej. 1001) o nombre del niño/a" autocomplete="off">' +
      '<button class="btn gris" data-accion="buscarConsulta">🔎 Ver</button>' +
      '<button class="btn gris" data-accion="limpiarConsulta">Limpiar</button>' +
    '</div>' +
    '<div id="resConsulta">' + resultadosConsulta(consultaQ) + '</div>' +
  '</section>';
}
function resultadosConsulta(q) {
  q = String(q || '').trim();
  if (!q) return '<p class="vacio">Ingresá el código o el nombre para ver la información.</p>';
  var esCodigo = /^\d{3,6}$/.test(q);
  var res = D.alumnos.filter(function (a) {
    if (a.activo === false && !admin) return false;
    if (esCodigo) return String(a.codigo) === q;
    if (!D.buscarPorNombre && !admin) return false;
    return norm(a.nombre).indexOf(norm(q)) >= 0;
  });
  if (!res.length) {
    return '<p class="vacio">No se encontró ningún niño/a con ese ' + (esCodigo ? 'código' : 'nombre') + '.<br>Verificá el dato o consultá con el catequista.</p>';
  }
  if (res.length > 12) res = res.slice(0, 12);
  return res.map(function (a) {
    var f = fechaConsulta(a.id);
    var s = situacion(a.id, f);
    var r = regDe(a.id, f) || {};
    var n = nivel(a.nivelId) || {};
    var hist = Object.keys(D.registros).filter(function (k) { return k.indexOf(a.id + '|') === 0; })
      .map(function (k) { return D.registros[k]; })
      .sort(function (x, y) { return y.fecha < x.fecha ? -1 : 1; }).slice(0, 6);
    return '' +
    '<div class="tarjeta-consulta">' +
      '<h3>' + esc(a.nombre) + '</h3>' +
      '<div class="kv">Código #' + esc(a.codigo) + ' · ' + esc(n.nombre || '') + ' · ' + esc(D.fraternidad.nombre || '') + '</div>' +
      '<div class="estado-grande ' + s.clase + '">' + (s.clase === 'retirado' ? '🚪' : s.clase === 'en-clase' ? '✅' : s.clase === 'ausente' ? '❌' : s.clase === 'justificado' ? '📄' : '⏳') + ' ' + esc(s.titulo) + '</div>' +
      '<div class="dato"><b>Fecha consultada</b><span>' + fechaLarga(f) + '</span></div>' +
      '<div class="dato"><b>Detalle</b><span>' + esc(s.detalle || '—') + '</span></div>' +
      (r.retirado ? '<div class="dato"><b>Retirado con</b><span>' + esc(r.con || '—') + (r.parentesco ? ' (' + esc(r.parentesco) + ')' : '') + '</span></div>' +
        '<div class="dato"><b>Hora del retiro</b><span>' + esc(r.horaSalida || '—') + '</span></div>' : '') +
      '<div class="dato"><b>Catequista</b><span>' + esc(n.catequistas || '—') + '</span></div>' +
      (hist.length ? '<div class="dato"><b>Últimos registros</b><span>' + hist.map(function (h) {
        var t = h.estado ? ESTADOS[h.estado].t : '—';
        return fechaCorta(h.fecha) + ': ' + t + (h.retirado ? ' · retirado' + (h.con ? ' con ' + esc(h.con) : '') + (h.horaSalida ? ' ' + h.horaSalida : '') : '');
      }).join('<br>') + '</span></div>' : '') +
    '</div>';
  }).join('');
}

/* ------------------- modo padres (pantalla grande) ---------------------- */
/* Para el salón: el papá o la mamá toca su nombre en una lista grande y ve el
   estado del chico. No hay que escribir códigos, ni links, ni hace falta red. */
var kiosco = { abierto: false, nivelId: null, alumnoId: null, q: '' };
var kioscoTimer = null;

function abrirKiosco() {
  kiosco.abierto = true;
  if (!kiosco.nivelId || !nivel(kiosco.nivelId)) kiosco.nivelId = nivelId || (D.niveles[0] || {}).id;
  kiosco.alumnoId = null;
  kiosco.q = '';
  $('#kiosco').classList.remove('oculto');
  $('#kiosco').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  pintarKiosco();
}
function cerrarKiosco() {
  kiosco.abierto = false;
  kiosco.alumnoId = null;
  $('#kiosco').classList.add('oculto');
  $('#kiosco').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (kioscoTimer) { clearTimeout(kioscoTimer); kioscoTimer = null; }
}
function temporizadorKiosco(ms) {
  if (kioscoTimer) clearTimeout(kioscoTimer);
  kioscoTimer = setTimeout(function () { if (kiosco.abierto) cerrarKiosco(); }, ms);
}
function kioscoItems() {
  var q = norm(kiosco.q);
  var lista = alumnosDe(kiosco.nivelId).filter(function (a) {
    if (!q) return true;
    return norm(a.nombre).indexOf(q) >= 0 || String(a.codigo).indexOf(q) >= 0;
  });
  if (!lista.length) return '<p class="vacio">No encontramos ese nombre. Consultá con el catequista.</p>';
  return lista.map(function (a) {
    return '<button class="kiosco-nombre" data-accion="kioscoAlumno" data-id="' + a.id + '">' +
      '<b>' + esc(a.nombre) + '</b><span>#' + esc(a.codigo) + '</span></button>';
  }).join('');
}
function pintarKiosco() {
  if (!kiosco.abierto) return;
  $('#kioscoFecha').textContent = fechaLarga(hoyISO());
  var cuerpo = $('#kioscoCuerpo');
  if (kiosco.alumnoId) {
    cuerpo.innerHTML = kioscoDetalle(kiosco.alumnoId);
    temporizadorKiosco(60000);
    return;
  }
  cuerpo.innerHTML =
    '<p class="kiosco-preg">¿Cómo se llama tu hijo o hija?</p>' +
    '<input id="qKiosco" class="kiosco-buscar" data-accion="kioscoBuscar" value="' + esc(kiosco.q) + '" placeholder="Escribí el nombre o el código…" autocomplete="off">' +
    '<div class="kiosco-niveles">' + D.niveles.map(function (x) {
      return '<button data-accion="kioscoNivel" data-id="' + x.id + '" class="' + (x.id === kiosco.nivelId ? 'act' : '') + '">' + esc(x.nombre) + '</button>';
    }).join('') + '</div>' +
    '<div class="kiosco-lista" id="kioscoLista">' + kioscoItems() + '</div>' +
    '<p class="kiosco-pie">Tocá un nombre para ver si ya se retiró y con quién se fue.</p>';
  temporizadorKiosco(180000);
}
function actualizarListaKiosco() {
  var cont = $('#kioscoLista');
  if (cont) cont.innerHTML = kioscoItems();
}
function kioscoDetalle(aid) {
  var a = alumno(aid);
  if (!a) { kiosco.alumnoId = null; return ''; }
  var n = nivel(a.nivelId) || {};
  var f = fechaConsulta(aid);
  var s = situacion(aid, f);
  var r = regDe(aid, f) || {};
  var icono = s.clase === 'retirado' ? '🚪' : s.clase === 'en-clase' ? '✅' : s.clase === 'ausente' ? '❌' :
    s.clase === 'justificado' ? '📄' : '⏳';
  return '' +
    '<button class="kiosco-volver" data-accion="kioscoVolver">← Volver a la lista</button>' +
    '<div class="kiosco-tarjeta">' +
      '<h2>' + esc(a.nombre) + '</h2>' +
      '<div class="kv">' + esc(n.nombre || '') + ' · Código #' + esc(a.codigo) + '</div>' +
      '<div class="estado-grande ' + s.clase + '">' + icono + ' ' + esc(s.titulo) + '</div>' +
      '<div class="dato"><b>Fecha</b><span>' + fechaLarga(f) + '</span></div>' +
      (r.retirado ? '<div class="dato"><b>Se retiró con</b><span>' + esc(r.con || '—') +
        (r.parentesco ? ' (' + esc(r.parentesco) + ')' : '') + '</span></div>' : '') +
      (r.retirado && r.horaSalida ? '<div class="dato"><b>Hora del retiro</b><span>' + esc(r.horaSalida) + '</span></div>' : '') +
      '<div class="dato"><b>Detalle</b><span>' + esc(s.detalle || '—') + '</span></div>' +
      '<div class="dato"><b>Catequista</b><span>' + esc(n.catequistas || '—') + '</span></div>' +
    '</div>' +
    '<p class="kiosco-pie">Listo. Tocá ✕ arriba a la derecha para cerrar.</p>';
}

/* ---------------------------- vista: reportes --------------------------- */
function vistaReportes() {
  var n = nivel(nivelId);
  if (!n) return '<section class="panel"><p class="vacio">Creá un nivel en ⚙️ Ajustes.</p></section>';
  var lista = alumnosDe(nivelId, true);
  var fechas = fechasDe(n).filter(function (f) { return mesDe(f) === mesRep; });
  var extra = {};
  Object.keys(D.registros).forEach(function (k) {
    var r = D.registros[k];
    if (mesDe(r.fecha) === mesRep && lista.some(function (a) { return a.id === r.alumnoId; })) extra[r.fecha] = 1;
  });
  Object.keys(extra).forEach(function (f) { if (fechas.indexOf(f) < 0) fechas.push(f); });
  fechas.sort();
  var opciones = D.niveles.map(function (x) {
    return '<option value="' + x.id + '"' + (x.id === nivelId ? ' selected' : '') + '>' + esc(x.nombre) + '</option>';
  }).join('');
  var cab = fechas.map(function (f) { return '<th class="c">' + fechaCorta(f) + '</th>'; }).join('');
  var filas = lista.map(function (a, i) {
    var tot = { p: 0, a: 0, t: 0, j: 0 }, celdas = '';
    fechas.forEach(function (f) {
      var r = regDe(a.id, f), e = r ? r.estado : '';
      if (e === 'presente') tot.p++; else if (e === 'ausente') tot.a++; else if (e === 'tarde') tot.t++; else if (e === 'justificado') tot.j++;
      celdas += '<td class="c ' + (r && r.retirado ? 'conRetiro' : '') + '" data-accion="irAFecha" data-fecha="' + f + '" title="' + esc(a.nombre) + ' · ' + fechaLarga(f) + (r && r.retirado ? ' · retirado con ' + (r.con || '—') : '') + '">' +
        (e ? '<span class="' + ESTADOS[e].c + '">' + ESTADOS[e].s + '</span>' : '<span style="color:#c3cbd6">·</span>') +
        (r && r.retirado ? '<span title="retirado">🚪</span>' : '') + '</td>';
    });
    var total = tot.p + tot.a + tot.t + tot.j;
    var pct = total ? Math.round((tot.p + tot.t) * 100 / total) : 0;
    return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(a.nombre) + '</td>' + celdas +
      '<td class="c"><b>' + tot.p + '</b></td><td class="c">' + (tot.a + tot.j) + '</td><td class="c">' + tot.t + '</td><td class="c">' + pct + '%</td></tr>';
  }).join('');
  var pieFechas = fechas.map(function (f) {
    var res = resumenDia(nivelId, f);
    return '<td class="c"><b>' + res.p + '</b><div class="meta">' + res.a + 'a</div></td>';
  }).join('');
  return '' +
  '<section class="panel">' +
    '<div class="barra noImprimir">' +
      '<label class="campo"><span>Nivel</span><select data-accion="cambiarNivel">' + opciones + '</select></label>' +
      '<label class="campo"><span>Mes</span><input type="month" data-accion="cambiarMes" value="' + mesRep + '"></label>' +
      '<button class="btn" data-accion="exportarXLSX">📥 Descargar planilla (.xlsx)</button>' +
      '<button class="btn gris" data-accion="exportarCSV">CSV</button>' +
      '<button class="btn gris" data-accion="imprimir">🖨️ Imprimir</button>' +
      '<button class="btn gris" data-accion="planillaBlanco">📄 En blanco</button>' +
    '</div>' +
    '<h2>' + esc(D.parroquia || '') + ' · ' + esc(D.coordinacion || '') + '</h2>' +
    '<p class="kv">Planilla de asistencia mensual · Fraternidad ' + esc(D.fraternidad.nombre || '') + ' · Sector ' + esc(D.fraternidad.sector || '') +
      ' · Nivel ' + esc(n.nombre) + ' · Catequista: ' + esc(n.catequistas || '—') + ' · Mes ' + mesLargo(mesRep) + ' · Año ' + D.anio + '</p>' +
    '<p class="kv">Leyenda: <span class="marca-p">✓</span> presente · <span class="marca-a">✗</span> ausente · <span class="marca-t">T</span> tarde · <span class="marca-j">J</span> justificado · 🚪 se retiró (tocá la celda para ver o cargar ese día)</p>' +
    '<div class="tabla-scroll"><table><thead><tr><th class="c" style="width:40px">N°</th><th style="min-width:200px">Nombre completo del catequizando</th>' + cab +
      '<th class="c">P</th><th class="c">A</th><th class="c">T</th><th class="c">%</th></tr></thead><tbody>' +
      (filas || '<tr><td colspan="6" class="c">Sin alumnos</td></tr>') +
      '</tbody><tfoot><tr><th class="c" colspan="2">Total presentes por día</th>' + pieFechas + '<th colspan="4"></th></tr></tfoot></table></div>' +
  '</section>';
}

/* ------------------------------- modales -------------------------------- */

    }

      return '<label class="campoM">' + esc(c.etiqueta) + '<textarea rows="3" data-campoM="' + c.clave + '">' + esc(v) + '</textarea></label>';

function abrirModal(op, onOk) {

}
function cerrarModal() {
  var m = $('#modal');
  m.classList.add('oculto'); m.innerHTML = ''; modalOk = null;
}
function leerModal() {
  var out = {};
  $$('[data-campoM]', $('#modal')).forEach(function (el) {
    out[el.dataset.campom] = el.type === 'checkbox' ? el.checked : el.value;

}
function pedirPin(despues) {

    titulo: '🔐 Modo catequista',
    campos: [{ clave: 'pin', etiqueta: 'Clave (PIN)', valor: '', tipo: 'password' }],
    textoOk: 'Entrar'
  }, function (v) {
    if (String(v.pin) === String(D.pin)) {
      admin = true;
      try { sessionStorage.setItem(CLAVE_SESION, '1'); } catch (e) {}
      cerrarModal(); render(); aviso('Modo catequista activado', 'ok');
      if (despues) despues();
