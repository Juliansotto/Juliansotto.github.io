/* ------------------------- acciones de la interfaz ---------------------- */
function accion(nombre, el) {
  var aid = el.dataset ? el.dataset.id : null;
  if (nombre !== 'tab' && nombre !== 'cerrarModal') { /* nada */ }
  switch (nombre) {
    case 'tab':
      if (el.dataset.vista === 'ajustes' && !admin) { pedirPin(function () { vista = 'ajustes'; render(); }); return; }
      vista = el.dataset.vista; render();
      break;
    case 'abrirModo': pedirPin(); break;
    case 'abrirKiosco': abrirKiosco(); break;
    case 'cerrarKiosco': cerrarKiosco(); break;
    case 'kioscoNivel':
      kiosco.nivelId = el.dataset.id; kiosco.alumnoId = null; pintarKiosco(); break;
    case 'kioscoAlumno':
      kiosco.alumnoId = el.dataset.id; pintarKiosco(); break;
    case 'kioscoVolver':
      kiosco.alumnoId = null; pintarKiosco(); break;
    case 'bloquear':
      admin = false;
      try { sessionStorage.removeItem(CLAVE_SESION); } catch (e) {}
      if (vista === 'ajustes') vista = 'consulta';
      render(); aviso('Modo consulta activado');
      break;
    case 'cerrarModal': cerrarModal(); break;
    case 'modalOk':
      if (modalOk) { var v = leerModal(); var r = modalOk(v); if (r !== false) cerrarModal(); }
      else cerrarModal();
      break;
    case 'cambiarNivel':
      nivelId = el.value; fecha = fechaSugerida(nivel(nivelId)); mesRep = mesDe(fecha); render();
      break;
    case 'cambiarFecha': fecha = el.value; render(); break;
    case 'cambiarMes': mesRep = el.value; render(); break;
    case 'irHoy': fecha = hoyISO(); mesRep = mesDe(fecha); render(); break;
    case 'irAFecha': fecha = el.dataset.fecha; vista = 'asistencia'; render(); break;
    case 'fechaManual':
      if (el.value) { fecha = el.value; mesRep = mesDe(fecha); if (fechasDe(nivel(nivelId)).indexOf(fecha) < 0) { nivel(nivelId).fechas.push(fecha); nivel(nivelId).fechas.sort(); guardar(); } render(); }
      break;
    case 'todosPresentes':
      if (!admin) return;
      var antes = resumenDia(nivelId, fecha);
      if ((antes.a + antes.t + antes.j) > 0 && !confirm('Se van a marcar los ' + alumnosDe(nivelId).length +
        ' alumnos como presentes, reemplazando las marcas que ya hay en este día.\n\nDespués podés marcar los ausentes uno por uno.\n\n¿Continuar?')) return;
      alumnosDe(nivelId).forEach(function (a) {
        var r = obtenerReg(a.id, fecha, true);
        r.estado = 'presente';
        r.actualizado = new Date().toISOString(); r.por = D.catequistaActual || '';
      });
      guardar('Todos marcados como presentes', true); render();
      break;
    case 'limpiarDia':
      if (!admin) return;
      if (!confirm('¿Borrar todas las marcas del ' + fechaLarga(fecha) + '?')) return;
      alumnosDe(nivelId).forEach(function (a) { borrarReg(a.id, fecha); });
      guardar('Día limpiado'); render();
      break;
    case 'estado':
      if (!admin) { pedirPin(); return; }
      setEstado(aid, fecha, el.dataset.estado); refrescarTarjeta(aid);
      break;
    case 'editarAlumno': abrirModalAlumno(aid); break;
    case 'nuevoAlumno': abrirModalAlumno(null); break;
    case 'borrarAlumno':
      if (!admin) return;
      var a = alumno(aid);
      if (!a) return;
      if (!confirm('¿Borrar a ' + a.nombre + ' y todas sus asistencias?')) return;
      D.alumnos = D.alumnos.filter(function (x) { return x.id !== aid; });
      Object.keys(D.registros).forEach(function (k) { if (k.indexOf(aid + '|') === 0) delete D.registros[k]; });
      guardar('Alumno borrado', true); render();
      break;
    case 'verificarTodos':
      if (!admin) return;
      alumnosDe(nivelId, true).forEach(function (x) { x.revisar = false; });
      guardar('Nombres marcados como verificados', true); render();
      break;
    case 'buscarConsulta': consultaQ = ($('#qConsulta') || {}).value || consultaQ; render(); break;
    case 'limpiarConsulta': consultaQ = ''; render(); break;
    case 'enlaces': abrirEnlaces(); break;
    case 'copiar':
      var texto = el.dataset.texto || '';
      copiar(texto);
      break;
    case 'exportarXLSX': exportarXLSX(); break;
    case 'exportarCSV': exportarCSV(); break;
    case 'exportarJSON': exportarJSON(); break;
    case 'importarJSON': $('#archivoJSON').click(); break;
    case 'imprimir': window.print(); break;
    case 'planillaBlanco': planillaEnBlanco(); break;
    case 'restaurarFotos':
      if (!confirm('Se van a agregar los alumnos de las fotos que falten (no se borra nada). ¿Continuar?')) return;
      restaurarFotos(); break;
    case 'borrarRegistros':
      if (!admin) return;
      if (!confirm('¿Borrar todas las asistencias del nivel "' + (nivel(nivelId) || {}).nombre + '"? Los alumnos se mantienen.')) return;
      var ids = alumnosDe(nivelId, true).map(function (x) { return x.id; });
      Object.keys(D.registros).forEach(function (k) {
        if (ids.indexOf(D.registros[k].alumnoId) >= 0) delete D.registros[k];
      });
      guardar('Asistencias borradas', true); render();
      break;
    case 'borrarTodo':
      if (!confirm('⚠️ Se borra TODO (alumnos, asistencias y ajustes) y vuelven las listas originales. ¿Seguro?')) return;
      if (!confirm('Última confirmación: ¿borrar todo?')) return;
      try { localStorage.removeItem(CLAVE); } catch (e) {}
      D = normalizar(JSON.parse(JSON.stringify(DATOS_INICIALES)));
      nivelId = D.niveles[0].id; fecha = fechaSugerida(nivel(nivelId)); guardar('Todo reiniciado', true); render();
      break;
    case 'nuevoNivel':
      abrirModalNivel(null); break;
    case 'editarNivel': abrirModalNivel(el.dataset.id); break;
    case 'borrarNivel':
      if (!admin) return;
      var nv = nivel(el.dataset.id);
      if (!nv) return;
      if (D.niveles.length <= 1) { aviso('Tiene que quedar al menos un nivel', 'error'); return; }
      if (!confirm('¿Borrar el nivel "' + nv.nombre + '" con sus ' + alumnosDe(nv.id, true).length + ' alumnos?')) return;
      D.niveles = D.niveles.filter(function (x) { return x.id !== nv.id; });
      var borrar = alumnosDe(nv.id, true).map(function (x) { return x.id; });
      D.alumnos = D.alumnos.filter(function (x) { return borrar.indexOf(x.id) < 0; });
      Object.keys(D.registros).forEach(function (k) { if (borrar.indexOf(D.registros[k].alumnoId) >= 0) delete D.registros[k]; });
      if (nivelId === nv.id) { nivelId = D.niveles[0].id; fecha = fechaSugerida(nivel(nivelId)); }
      guardar('Nivel borrado', true); render();
      break;
    case 'agregarFecha':
      var nf = ($('#nuevaFecha') || {}).value;
      if (!nf) { aviso('Elegí una fecha', 'error'); return; }
      var nn = nivel(nivelId);
      if (nn.fechas.indexOf(nf) < 0) nn.fechas.push(nf);
      nn.fechas.sort(); mesRep = mesDe(nf); guardar('Fecha agregada', true); render();
      break;
    case 'quitarFecha':
      var nq = nivel(nivelId), qf = el.dataset.fecha;
      nq.fechas = nq.fechas.filter(function (x) { return x !== qf; });
      guardar('Fecha quitada', true); render();
      break;
    case 'generarSabados':
      var mm = ($('#mesSabados') || {}).value;
      if (!mm) return;
      var ng = nivel(nivelId);
      sabadosDelMes(mm).forEach(function (f) { if (ng.fechas.indexOf(f) < 0) ng.fechas.push(f); });
      ng.fechas.sort(); mesRep = mm; guardar('Sábados agregados', true); render();
      break;
  }
}

/* ------------------------- alumnos: alta y edición ---------------------- */
function abrirModalAlumno(aid) {
  if (!admin) { pedirPin(); return; }
  var a = aid ? alumno(aid) : null;
  var opcionesNiveles = D.niveles.map(function (x) { return { v: x.id, t: x.nombre }; });
  abrirModal({
    titulo: a ? 'Editar alumno' : 'Agregar alumno',
    campos: [
      { clave: 'nombre', etiqueta: 'Nombre y apellido (como en el C.I.)', valor: a ? a.nombre : '', placeholder: 'Ej: Hanna Yanila Totales Pereira' },
      { clave: 'codigo', etiqueta: 'Código para la consulta de los padres', valor: a ? a.codigo : proximoCodigo(), tipo: 'text', ayuda: 'Con este número el familiar consulta si el niño ya se retiró.' },
      { clave: 'nivelId', etiqueta: 'Nivel de catequesis', valor: a ? a.nivelId : nivelId, tipo: 'select', opciones: opcionesNiveles },
      { clave: 'nota', etiqueta: 'Observación (opcional)', valor: a ? (a.nota || '') : '', placeholder: 'Ej: completar apellido materno' },
      { clave: 'verificado', etiqueta: 'Nombre verificado con la planilla de papel', valor: a ? !a.revisar : true, tipo: 'check' },
      { clave: 'activo', etiqueta: 'Alumno activo (aparece en la lista)', valor: a ? a.activo !== false : true, tipo: 'check' }
    ],
    textoOk: a ? 'Guardar cambios' : 'Agregar'
  }, function (v) {
    var nombre = String(v.nombre || '').trim();
    if (!nombre) { aviso('Escribí el nombre', 'error'); return false; }
    var codigo = String(v.codigo || '').trim() || proximoCodigo();
    if (a) {
      a.nombre = nombre; a.codigo = codigo; a.nota = String(v.nota || '').trim();
      a.revisar = !v.verificado; a.activo = !!v.activo;
      if (a.nivelId !== v.nivelId) { a.nivelId = v.nivelId; }
    } else {
      D.alumnos.push({
        id: nuevoId('a'), nombre: nombre, codigo: codigo,
        nivelId: v.nivelId || nivelId, revisar: !v.verificado, activo: !!v.activo,
        nota: String(v.nota || '').trim()
      });
    }
    guardar(a ? 'Alumno actualizado' : 'Alumno agregado', true);
    render();
  });
}
function proximoCodigo() {
  var max = 1000;
  D.alumnos.forEach(function (a) { max = Math.max(max, parseInt(a.codigo, 10) || 1000); });
  return String(max + 1);
}
function abrirModalNivel(id) {
  var n = id ? nivel(id) : null;
  abrirModal({
    titulo: n ? 'Editar nivel' : 'Nuevo nivel',
    campos: [
      { clave: 'nombre', etiqueta: 'Nombre del nivel', valor: n ? n.nombre : '', placeholder: 'Iniciación / Confesión / Primera Comunión' },
      { clave: 'catequistas', etiqueta: 'Catequista(s)', valor: n ? n.catequistas : '', placeholder: 'Ej: Juana Sotto · Nayeli Alonso' },
      { clave: 'mes', etiqueta: 'Mes de inicio (aaaa-mm)', valor: n ? (mesDe(fechasDe(n)[0] || '') || mesRep) : mesRep, tipo: 'month' }
    ],
    textoOk: n ? 'Guardar' : 'Crear'
  }, function (v) {
    var nombre = String(v.nombre || '').trim();
    if (!nombre) { aviso('Escribí el nombre del nivel', 'error'); return false; }
    if (n) {
      n.nombre = nombre; n.catequistas = String(v.catequistas || '').trim();
    } else {
      var nuevo = { id: nuevoId('n'), nombre: nombre, catequistas: String(v.catequistas || '').trim(), fechas: [], mes: v.mes || mesRep };
      if (v.mes) nuevo.fechas = sabadosDelMes(v.mes);
      D.niveles.push(nuevo);
      nivelId = nuevo.id; fecha = fechaSugerida(nuevo);
    }
    guardar('Nivel guardado', true); render();
  });
}
function abrirEnlaces() {
  var base = (location.origin && location.origin !== 'null') ? location.origin + location.pathname : location.href.split('#')[0];
  var lista = alumnosDe(nivelId).map(function (a) {
    return { nombre: a.nombre, url: base + '#consulta=' + encodeURIComponent(a.codigo) };
  });
  var html = '<p class="ayuda">Cada familiar abre su enlace en el celular y ve el estado de su hijo/a. ' +
    'También puede entrar a <b>Consulta padres</b> y escribir el código.</p>' +
    (Nube.on ? '' : '<p class="ayuda">⚠️ Estos enlaces apuntan a este equipo. Para que funcionen en los celulares de la misma red, iniciá el servidor (<code>node servidor.js</code>) y volvé a generarlos.</p>') +
    '<div class="lista-enlaces">' + (lista.map(function (x) {
      return '<div class="enlace"><span style="min-width:150px"><b>' + esc(x.nombre) + '</b></span><code>' + esc(x.url) + '</code>' +
        '<button class="btn gris chico" data-accion="copiar" data-texto="' + esc(x.url) + '">Copiar</button></div>';
    }).join('') || '<p class="vacio">Sin alumnos en este nivel.</p>') + '</div>';
  abrirModal({ titulo: '🔗 Enlaces de consulta · ' + (nivel(nivelId) || {}).nombre, html: html, textoOk: 'Cerrar' }, function () { return true; });
}
function copiar(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(function () { aviso('Enlace copiado', 'ok'); }, function () { aviso('No se pudo copiar', 'error'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); aviso('Enlace copiado', 'ok'); } catch (e) { aviso('Copiá manualmente: ' + texto, 'error'); }
    document.body.removeChild(ta);
  }
}

/* -------------------------------- exportar ------------------------------ */
/* Junta las marcas de un alumno en el mes y el detalle de retiros para la
   columna OBSERVACIONES de la planilla impresa. */
function marcasDe(aid, fechas) {
  var out = {}, obs = [];
  fechas.forEach(function (f) {
    var r = regDe(aid, f);
    if (!r) return;
    var m = '';
    if (r.estado === 'presente') m = 'P';
    else if (r.estado === 'ausente') m = 'A';
    else if (r.estado === 'tarde') m = 'T';
    else if (r.estado === 'justificado') m = 'J';
    if (m) out[f] = m;
    var detalle = '';
    if (r.retirado) {
      detalle = 'Retiró: ' + (r.con || r.parentesco || 'sin dato') +
        (r.con && r.parentesco ? ' (' + r.parentesco + ')' : '') +
        (r.horaSalida ? ' ' + r.horaSalida : '');
    }
    if (r.nota) detalle += (detalle ? ' · ' : '') + r.nota;
    if (detalle) obs.push({ fecha: f, texto: detalle });
  });
  var texto = '';
  if (obs.length === 1) texto = obs[0].texto;
  else if (obs.length > 1) texto = obs.map(function (o) { return fechaCorta(o.fecha) + ': ' + o.texto; }).join(' · ');
  return { marcas: out, obs: texto };
}
function limpiarArchivo(t) {
  return norm(t || 'planilla').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'planilla';
}
function exportarXLSX() {
  var n = nivel(nivelId) || {};
  var fechas = fechasDe(n).filter(function (f) { return mesDe(f) === mesRep; });
  if (!fechas.length) { aviso('Este mes todavía no tiene días de clase cargados', 'error'); return; }
  if (!(window.CatequesisXLSX && CatequesisXLSX.construir)) { aviso('No se encontró el generador de planillas', 'error'); return; }
  var filas = alumnosDe(nivelId, true).map(function (a) {
    var m = marcasDe(a.id, fechas);
    return { nombre: a.nombre, marcas: m.marcas, obs: m.obs };
  });
  var bytes;
  try {
    bytes = CatequesisXLSX.construir({
      titulo: 'PLANILLA DE ASISTENCIA',
      nivel: n.nombre,
      catequistas: n.catequistas || '',
      anio: D.anio,
      fraternidad: D.fraternidad.nombre,
      sector: D.fraternidad.sector,
      fechas: fechas,
      filas: filas,
      hoja: n.nombre,
      leyenda: 'P = presente · A = ausente · T = tarde · J = justificado · OBSERVACIONES: con quién se retiró y novedades'
    });
  } catch (e) {
    aviso('No se pudo armar el archivo: ' + e.message, 'error');
    return;
  }
  descargarBytes('Planilla_2026_' + limpiarArchivo(n.nombre) + '_' + limpiarArchivo(mesLargo(mesRep)) + '.xlsx', bytes,
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  aviso('Planilla descargada: está en la carpeta Descargas', 'ok');
}
function exportarCSV() {
  var n = nivel(nivelId) || {};
  var fechas = fechasDe(n).filter(function (f) { return mesDe(f) === mesRep; });
  var filas = [['N°', 'Nombre completo', 'Código', 'Nivel'].concat(fechas.map(fechaCorta)).concat(['Presentes', 'Ausentes', 'Tarde', 'Justificados', '%'])]
    .concat(alumnosDe(nivelId, true).map(function (a, i) {
      var tot = { p: 0, a: 0, t: 0, j: 0 };
      var celdas = fechas.map(function (f) {
        var r = regDe(a.id, f), e = r ? r.estado : '';
        if (e === 'presente') tot.p++; else if (e === 'ausente') tot.a++; else if (e === 'tarde') tot.t++; else if (e === 'justificado') tot.j++;
        return e ? ESTADOS[e].s + (r.retirado ? ' (retirado con ' + (r.con || '') + (r.horaSalida ? ' ' + r.horaSalida : '') + ')' : '') : '';
      });
      var total = tot.p + tot.a + tot.t + tot.j;
      return [i + 1, a.nombre, a.codigo, n.nombre].concat(celdas).concat([tot.p, tot.a, tot.t, tot.j, total ? Math.round((tot.p + tot.t) * 100 / total) + '%' : '']);
    }));
  var csv = '\ufeff' + filas.map(function (f) {
    return f.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(';');
  }).join('\r\n');
  descargar('planilla-' + norm(n.nombre || 'nivel').replace(/\s+/g, '-') + '-' + mesRep + '.csv', csv, 'text/csv;charset=utf-8');
  aviso('CSV descargado', 'ok');
}
function exportarJSON() {
  descargar('copia-catequesis-' + hoyISO() + '.json', JSON.stringify(D, null, 2), 'application/json');
  aviso('Copia descargada', 'ok');
}
function importarJSON(texto) {
  try {
    var d = JSON.parse(texto);
    if (!d || !d.alumnos) throw new Error('formato');
    D = normalizar(d);
    nivelId = (nivel(nivelId) ? nivelId : (D.niveles[0] || {}).id);
    fecha = fechaSugerida(nivel(nivelId));
    guardar('Copia restaurada', true); render(); aviso('Copia restaurada', 'ok');
  } catch (e) { aviso('El archivo no es una copia válida', 'error'); }
}
function restaurarFotos() {
  var nivelesFoto = { 'Iniciación': 'n-iniciacion', 'Confesión': 'n-confesion', 'Primera Comunión': 'n-comunion' };
  var agregados = 0;
  D.niveles.forEach(function (nv) {
    var semilla = DATOS_INICIALES.niveles.filter(function (x) { return norm(x.nombre) === norm(nv.nombre); })[0];
    if (!semilla) return;
    var deFoto = DATOS_INICIALES.alumnos.filter(function (a) { return a.nivelId === semilla.id; });
    var existentes = alumnosDe(nv.id, true).map(function (a) { return norm(a.nombre); });
    deFoto.forEach(function (a) {
      if (existentes.indexOf(norm(a.nombre)) >= 0) return;
      D.alumnos.push({
        id: nuevoId('a'), nombre: a.nombre, codigo: a.codigo || proximoCodigo(),
        nivelId: nv.id, revisar: true, activo: true, nota: a.nota || ''
      });
      agregados++;
    });
  });
  guardar('Listas de las fotos restauradas (' + agregados + ' alumnos agregados)', true);
  render();
}
function planillaEnBlanco() {
  var n = nivel(nivelId) || {}, lista = alumnosDe(nivelId, true);
  var fechas = fechasDe(n).filter(function (f) { return mesDe(f) === mesRep; });
  var html = '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Planilla ' + esc(n.nombre) + ' ' + mesRep + '</title>' +
    '<style>body{font-family:system-ui,Arial,sans-serif;padding:14px}h1{font-size:15px;text-align:center;margin:0}h2{font-size:12px;text-align:center;font-weight:400;margin:2px 0 12px}' +
    'table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #333;padding:4px 3px}th{background:#eee}.c{text-align:center}' +
    '.alto{height:20px}@page{size:A4 portrait;margin:12mm}</style></head><body>' +
    '<h1>' + esc(D.parroquia) + ' — ' + esc(D.coordinacion) + '</h1>' +
    '<h2>Planilla de asistencia mensual · Fraternidad ' + esc(D.fraternidad.nombre) + ' · Sector ' + esc(D.fraternidad.sector) +
    ' · Nivel ' + esc(n.nombre) + ' · Catequista: ' + esc(n.catequistas || '') + ' · Mes ' + mesLargo(mesRep) + ' · Año ' + D.anio + '</h2>' +
    '<table><thead><tr><th class="c" style="width:26px">N°</th><th>Nombre completo del catequizando</th>' +
    fechas.map(function (f) { return '<th class="c" style="width:52px">' + fechaCorta(f) + '</th>'; }).join('') +
    '<th style="width:130px">Se retiró con / observaciones</th></tr></thead><tbody>' +
    (lista.map(function (a, i) {
      return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(a.nombre) + '</td>' +
        fechas.map(function () { return '<td class="alto"></td>'; }).join('') + '<td></td></tr>';
    }).join('') || '') +
    '</tbody></table>' +
    '<scr' + 'ipt>window.onload=function(){setTimeout(function(){window.print();},400);};</scr' + 'ipt></body></html>';
  var w = window.open('', '_blank');
  if (!w) { aviso('Permití las ventanas emergentes para imprimir', 'error'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ------------------------------ interacción ----------------------------- */
function manejarCampoRetiro(el) {
  if (!admin) return;
  var aid = el.dataset.id, campo = el.dataset.campo;
  var valor = el.type === 'checkbox' ? el.checked : el.value;
  setCampo(aid, fecha, campo, valor);
  var chip = $('[data-chip="' + aid + '"]');
  if (chip) { var s = situacion(aid, fecha); chip.className = 'chipSalida ' + s.clase; chip.textContent = s.titulo; }
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-accion]') : null;
  if (!el) return;
  var t = el.tagName;
  /* los campos de texto y casillas se atienden con los eventos input/change */
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'LABEL') return;
  ev.preventDefault();
  accion(el.dataset.accion, el);
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (!el.dataset || !el.dataset.accion) return;
  if (el.dataset.accion === 'filtro') {
    filtroAlumnos = el.value;
    var cont = $('#listaAlumnos');
    if (cont) cont.innerHTML = listaTarjetas();
    return;
  }
  if (el.dataset.accion === 'consultaQ') { consultaQ = el.value; return; }
  if (el.dataset.accion === 'kioscoBuscar') { kiosco.q = el.value; actualizarListaKiosco(); temporizadorKiosco(180000); return; }
  if (el.dataset.accion === 'campoRetiro') { manejarCampoRetiro(el); return; }
  if (el.dataset.accion === 'ajuste') {
    var campoA = el.dataset.campo, valorA = el.value;
    if (campoA === 'fraternidad_nombre') D.fraternidad.nombre = valorA;
    else if (campoA === 'fraternidad_sector') D.fraternidad.sector = valorA;
    else if (campoA === 'anio') D.anio = parseInt(valorA, 10) || D.anio;
    else if (campoA === 'pin') D.pin = valorA;
    else D[campoA] = valorA;
    guardar();
    return;
  }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.id === 'archivoJSON' && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { importarJSON(String(fr.result)); };
    fr.readAsText(el.files[0]);
    return;
  }
  if (!el.dataset || !el.dataset.accion) return;
  if (el.dataset.accion === 'ajusteCheck') {
    D[el.dataset.campo] = el.checked; guardar(); return;
  }
  if (el.dataset.accion === 'campoRetiro' && el.type === 'checkbox') { manejarCampoRetiro(el); return; }
  if (['cambiarNivel', 'cambiarFecha', 'cambiarMes', 'fechaManual'].indexOf(el.dataset.accion) >= 0) {
    accion(el.dataset.accion, el);
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && kiosco.abierto) { cerrarKiosco(); return; }
  var m = $('#modal');
  if (m && !m.classList.contains('oculto')) {
    if (ev.key === 'Escape') { cerrarModal(); }
    if (ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA') {
      var b = $('[data-accion="modalOk"]', m);
      if (b) { ev.preventDefault(); b.click(); }
    }
    return;
  }
  if (ev.key !== 'Enter') return;
  if (ev.target && ev.target.dataset && ev.target.dataset.accion === 'consultaQ') {
    consultaQ = ev.target.value; render();
  }
});

/* --------------------------------- inicio ------------------------------- */
function leerHash() {
  var h = location.hash || '';
  var m = h.match(/consulta=([^&]+)/);
  if (m) { consultaQ = decodeURIComponent(m[1]); vista = 'consulta'; return; }
  var q = location.search.match(/[?&]codigo=([^&]+)/);
  if (q) { consultaQ = decodeURIComponent(q[1]); vista = 'consulta'; return; }
  var v = h.match(/vista=([a-z]+)/);
  if (v && ['asistencia', 'alumnos', 'consulta', 'reportes', 'ajustes'].indexOf(v[1]) >= 0) {
    vista = (v[1] === 'ajustes' && !admin) ? 'consulta' : v[1];
  }
}
leerHash();
render();
Nube.iniciar().then(function (ok) {
  if (ok) {
    if (!nivel(nivelId)) nivelId = (D.niveles[0] || {}).id;
    fecha = fechaSugerida(nivel(nivelId));
    render();
    aviso('Conectado: los datos se comparten en la red local', 'ok');
  }
  pintarCabecera();
});
setInterval(function () {
  if (Date.now() - ultimaEdicion > 8000) Nube.traer();
}, 15000);
window.addEventListener('hashchange', function () { leerHash(); render(); });
})();
</script>
